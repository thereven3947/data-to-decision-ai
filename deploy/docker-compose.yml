# Per-environment services on the Mac mini (OrbStack). Run via deploy/deploy.sh with
# --project-name d2d-<env> and --env-file ~/d2d/<env>/.env (see docs/deployment.md).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: d2d
      POSTGRES_USER: d2d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment .env}
    ports:
      - "127.0.0.1:${D2D_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2d -d d2d"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
