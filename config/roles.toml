# Roles and permissions (stage 10). See docs/domain-model.md#roles-and-permissions-stage-10.
# Each login account has one role (`d2d user add <name> --role <role>`). Owners may preview the
# other roles in the UI (X-D2D-Role header); everyone else always gets their own role.

[accounts]
# Who may have a login. Default: exactly one owner account. `d2d user add` refuses anything else,
# and the API refuses every login if the users file breaks this rule (fails closed).
# To invite people later: raise max_users and add their roles here, e.g. roles = ["owner", "guest"].
max_users = 1
roles = ["owner"]

[owner]
description = "Sees everything; reviews, labels and manages cases."
can_label = true

[family]
description = "All devices except those tagged private; chat and feedback."
hidden_device_tags = ["private"]

[energy_advisor]
description = "Energy and load categories only, no room names; chat and feedback."
energy_only = true
hide_rooms = true
hidden_device_tags = ["private"]

[guest]
description = "Published stories for shared rooms only; chat."
published_only = true
shared_rooms = ["living", "kitchen", "front_door", "front_yard"]
hidden_device_tags = ["private"]
