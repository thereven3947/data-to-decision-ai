# Semantic changelog rules (stage 2). See docs/domain-model.md#semantic-changelog-stage-2.
#
# Rules are evaluated in order; the first match wins. A property change that matches no rule is
# treated as expected operation (e.g. idle <-> running, small RSSI jitter) and is NOT emitted.
#
# Match fields:
#   property        fnmatch pattern on the flattened property name (schedule.start, settings.*, dq.*)
#   old_in / new_in value lists (values are compared as strings; booleans are "true"/"false")
#   old_is_null / new_is_null
#   old_in_window / new_in_window   name of a [windows] entry, for HH:MM values
#   min_abs_delta   numeric threshold on |new - old| (both values must be numeric)

[windows]
peak = ["16:00", "21:00"]
off_peak = ["22:00", "06:00"]
quiet_hours = ["22:00", "07:00"]   # local time of the household

[data_quality]
clock_skew_threshold_s = 300

# --- context rules over the CDC stream (M5-03) ---------------------------------------------
# Policy zones: a daily local window, or on/off episodes of a CDC property (pseudo-device "home").
[[zone]]
name = "quiet_hours"
window = "quiet_hours"

[[zone]]
name = "away_mode"
property = "away_mode"
on_value = "on"

[[duration]]
property = "door"
value = "open"
min_minutes = 30
kinds = ["garage_door"]
change_kind = "operational"
tag = "garage_left_open"

[[duration]]
property = "power"
value = "on"
min_minutes = 240
kinds = ["light_switch"]
zone = "away_mode"              # only time while nobody is home counts
change_kind = "operational"
tag = "lights_left_on_away"

[[zone_rule]]
property = "motion"
value = "detected"
kinds = ["ring_camera"]
zone = "away_mode"
change_kind = "operational"
tag = "motion_while_away"

[[zone_rule]]
property = "door"
value = "open"
kinds = ["garage_door"]
zone = "quiet_hours"
change_kind = "operational"
tag = "garage_opened_quiet_hours"

[[sequence]]
tag = "missed_visitor"
change_kind = "operational"
emit = { property = "visit", value = "missed" }
trigger = { property = "button", value = "pressed", kinds = ["ring_doorbell"] }
require = { property = "person", value = "detected", kinds = ["ring_camera", "ring_doorbell"], within_s = 60 }
absent = { property = "call", value = "answered", within_s = 120 }

# M5-06: snapshot state of mirrored devices must agree with the CDC feed (dq.cdc_gap).
[[reconcile]]
kinds = ["light_switch"]
cdc_property = "power"
snapshot_field = "state"
map = { on = "running", off = "idle" }
initial = "off"

[[reconcile]]
kinds = ["garage_door"]
cdc_property = "door"
snapshot_field = "state"
map = { open = "running", closed = "idle" }
initial = "closed"

# --- event-native device signals (CDC, M5-04) ----------------------------------------------
[[rule]]
property = "package"
new_in = ["detected"]
change_kind = "operational"
tag = "package_delivered"

[[rule]]
property = "battery"
new_in = ["low"]
change_kind = "operational"
tag = "battery_low"

[[rule]]
property = "online"
new_in = ["offline"]
change_kind = "operational"
tag = "device_offline"

[[rule]]
property = "online"
old_in = ["offline"]
change_kind = "operational"
tag = "device_recovered"

# --- data quality (emitted on onset only) ---------------------------------------------------
[[rule]]
property = "dq.negative_energy_delta"
change_kind = "data_quality"
tag = "dq_negative_energy_delta"

[[rule]]
property = "dq.clock_skew"
change_kind = "data_quality"
tag = "dq_clock_skew"

[[rule]]
property = "dq.cdc_gap"
change_kind = "data_quality"
tag = "dq_cdc_gap"

[[rule]]
property = "dq.duplicate_device"
change_kind = "data_quality"
tag = "dq_duplicate_device"

# --- topology -------------------------------------------------------------------------------
[[rule]]
property = "presence"
new_in = ["present"]
change_kind = "topology"
tag = "device_added"

[[rule]]
property = "presence"
change_kind = "topology"
tag = "device_removed"

[[rule]]
property = "circuit_id"
change_kind = "topology"
tag = "circuit_change"

[[rule]]
property = "room"
change_kind = "topology"
tag = "room_change"

[[rule]]
property = "network_id"
change_kind = "topology"
tag = "network_change"

# --- configuration --------------------------------------------------------------------------
[[rule]]
property = "firmware_version"
change_kind = "config"
tag = "firmware_update"

[[rule]]
property = "schedule.start"
old_in_window = "peak"
new_in_window = "off_peak"
change_kind = "config"
tag = "schedule_shift_off_peak"

[[rule]]
property = "schedule.*"
change_kind = "config"
tag = "schedule_change"

[[rule]]
property = "setpoint"
change_kind = "config"
tag = "setpoint_change"

[[rule]]
property = "mode"
change_kind = "config"
tag = "mode_change"

[[rule]]
property = "settings.child_lock"
change_kind = "config"
tag = "safety_child_lock_change"

[[rule]]
property = "settings.*"
change_kind = "config"
tag = "safety_setting_change"

# --- operational ----------------------------------------------------------------------------
[[rule]]
property = "state"
new_in = ["error"]
change_kind = "operational"
tag = "device_error"

[[rule]]
property = "state"
new_in = ["offline"]
change_kind = "operational"
tag = "device_offline"

[[rule]]
property = "state"
old_in = ["error", "offline"]
change_kind = "operational"
tag = "device_recovered"

[[rule]]
property = "error_code"
new_is_null = false
change_kind = "operational"
tag = "error_raised"

[[rule]]
property = "error_code"
change_kind = "operational"
tag = "error_cleared"

[[rule]]
property = "rssi_dbm"
min_abs_delta = 10
change_kind = "operational"
tag = "signal_shift"
