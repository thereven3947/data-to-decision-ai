# Static topology of the demo home (stage 1 input). See docs/domain-model.md.
# Devices with `active = false` are spares that scenarios add later (replacement, new device).

[home]
id = "home_demo"
timezone = "America/Los_Angeles"

[[upstream]]
id = "panel_main"
kind = "panel"

[[upstream]]
id = "hub_zigbee"
kind = "hub"

[[upstream]]
id = "router_mesh_1"
kind = "router"

[[upstream]]
id = "router_mesh_2"
kind = "router"

[[upstream]]
id = "router_mesh_3"
kind = "router"

[[circuit]]
id = "circuit_kitchen_1"
panel = "panel_main"
rating_amps = 20

[[circuit]]
id = "circuit_kitchen_2"
panel = "panel_main"
rating_amps = 20

[[circuit]]
id = "circuit_laundry"
panel = "panel_main"
rating_amps = 30

[[circuit]]
id = "circuit_garage"
panel = "panel_main"
rating_amps = 50

[[circuit]]
id = "circuit_utility"
panel = "panel_main"
rating_amps = 50

[[circuit]]
id = "circuit_living"
panel = "panel_main"
rating_amps = 15

[[circuit]]
id = "circuit_bedroom"
panel = "panel_main"
rating_amps = 15

[[device]]
id = "dishwasher"
kind = "dishwasher"
room = "kitchen"
circuit = "circuit_kitchen_2"
network = "router_mesh_1"
rated_w = 1800
standby_w = 1.5
firmware_version = "4.1.0"
schedule = { start = "18:00", end = "19:30" }
mode = "eco"
settings = { child_lock = true }
base_rssi_dbm = -58

