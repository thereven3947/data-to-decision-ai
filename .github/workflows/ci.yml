name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: d2d
          POSTGRES_USER: d2d
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U d2d -d d2d" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      D2D_TEST_DATABASE_URL: postgresql+psycopg://d2d:ci@localhost:5432/d2d
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_docs.py
      - run: uv run d2d simulate --data-dir data/check
      - run: uv run d2d run --data-dir data/check
      - run: uv run d2d eval changelog --data-dir data/check
      - run: uv run d2d eval linking --data-dir data/check
      - run: uv run d2d security scan --data-dir data/check
      - run: uv run d2d eval security --data-dir data/check
      - run: uv run d2d export warehouse --no-db --data-dir data/check
      - run: uv run d2d review export --no-db --data-dir data/check
      - run: uv run d2d train --training-set data/check/labels/training_set.jsonl --models-dir data/check/models
      - run: uv run d2d eval classifier --models-dir data/check/models
      - name: migrate and load into Postgres
        env:
          D2D_DATABASE_URL: postgresql+psycopg://d2d:ci@localhost:5432/d2d
        run: |
          uv run alembic upgrade head
          uv run d2d load --data-dir data/check
          uv run d2d load --data-dir data/check
          uv run d2d classify --models-dir data/check/models
          uv run d2d review queue
          uv run d2d feedback route
          uv run d2d notify --data-dir data/check
          uv run d2d calibrate --data-dir data/check --models-dir data/check/models --out data/check/calib
          uv run d2d export warehouse --data-dir data/check --out data/check/warehouse-db
          uv run alembic downgrade base
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web (typecheck, unit tests, lint, build)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: terraform (fmt, validate, mocked tests)
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          for m in gcp aws; do
            terraform -chdir=infra/terraform/$m init -backend=false -input=false
            terraform -chdir=infra/terraform/$m validate
            terraform -chdir=infra/terraform/$m test
          done
      - uses: astral-sh/setup-uv@v6
      - name: ansible (syntax check)
        run: >-
          uvx --from ansible-core ansible-playbook -i infra/ansible/inventory.example.ini
          infra/ansible/site.yml --syntax-check