[project]
name = "d2d"
version = "0.1.0"
description = "Data to Decision with AI: closed-loop change intelligence (smart-home toy domain)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "typer>=0.12",
  "tzdata>=2024.1",
]

[project.scripts]
d2d = "d2d.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
