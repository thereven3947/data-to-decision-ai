[project]
name = "d2d"
version = "0.1.0"
description = "Data to Decision with AI: closed-loop change intelligence (smart-home toy domain)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "mcp>=1.20",
  "numpy>=2.0",
  "psycopg[binary]>=3.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "tzdata>=2024.1",
  "uvicorn>=0.30",
]

[project.scripts]
d2d = "d2d.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]
# Heavy, optional: causal forests and plots for `d2d experiment` (uv sync --group experiment).
experiment = [
  "econml>=0.16",
  "matplotlib>=3.9",
]
# Heavy, optional: ONNX export and serving for `d2d model` (uv sync --group serving).
serving = [
    "onnx>=1.17",
    "onnxruntime>=1.20 ; python_full_version < '3.15'",
    "onnxscript>=0.3 ; python_full_version < '3.15'",
    "skl2onnx>=1.18",
    "torch>=2.5 ; python_full_version < '3.15'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU-only wheels on Linux (CI); macOS wheels from PyPI already run on CPU/MPS.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "joblib", "scipy", "scipy.*",
  "econml", "econml.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `serving` group: absent in the default environment, so typed as Any everywhere.
module = ["onnx", "onnx.*", "onnxruntime", "onnxruntime.*", "skl2onnx", "skl2onnx.*", "torch",
  "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
