[project]
name = "d2d"
version = "0.1.0"
description = "Data to Decision with AI: closed-loop change intelligence (smart-home toy domain)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "mcp>=1.20",
  "psycopg[binary]>=3.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "tzdata>=2024.1",
  "uvicorn>=0.30",
]

[project.scripts]
d2d = "d2d.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d2d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
