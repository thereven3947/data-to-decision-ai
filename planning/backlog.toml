# --- M5 event-native devices (see docs/feature-roadmap.md#m5--event-native-devices-and-notifications)
[[issue]]
id = "M5-01"
milestone = "M5"
title = "Simulator: Ring camera, Ring doorbell, light switches, garage door + CDC event stream"
size = "M"
status = "done"
depends_on = ["M2-03"]
acceptance = [
  "Devices declared in household.toml (kind, room, network, config attributes)",
  "Second-precision CDC events written to data/cdc/ (device_id, event, value, source, ts)",
  "Slow config (firmware, motion sensitivity, automations, auto-close timer) stays in snapshots",
]

[[issue]]
id = "M5-02"
milestone = "M5"
title = "Stage 1-3: ingest CDC events as change events alongside the snapshot diff"
size = "S"
status = "done"
depends_on = ["M5-01"]
acceptance = [
  "Routine CDC events are not emitted (same idle/running principle as snapshots)",
  "Event ids stay idempotent across snapshot and CDC sources",
]

[[issue]]
id = "M5-03"
milestone = "M5"
title = "Context rules: duration, policy zone (away_mode, quiet_hours), sequence"
size = "M"
depends_on = ["M5-02"]
acceptance = [
  "garage open > 30 min, light on > 4 h while away, motion while away",
  "doorbell ring -> person_detected -> no answer in 2 min = missed_visitor",
  "Thresholds and windows live in config, not code",
]

[[issue]]
id = "M5-04"
milestone = "M5"
title = "Scenarios + ground truth: package_delivery, garage_left_open_overnight, lights_left_on_away, motion_while_away, doorbell_battery_low, camera_offline, lighting_automation_changed"
size = "M"
depends_on = ["M5-03"]
acceptance = ["d2d eval changelog recall 1.0 / precision 1.0 including CDC scenarios"]

[[issue]]
id = "M5-05"
milestone = "M5"
title = "Notification stories: severity (info/notice/alert), ntfy push, quiet hours, one push per story"
size = "M"
depends_on = ["M3-01", "M4-03", "M5-04"]

[[issue]]
id = "M5-06"
milestone = "M5"
title = "dq.cdc_gap: reconcile CDC changes with the snapshot diff (missed or phantom CDC events)"
size = "S"
depends_on = ["M5-02"]
acceptance = [
  "For CDC devices, each snapshot-to-snapshot property change has a matching CDC change in that interval",
  "Mismatches emit dq.cdc_gap data-quality changes; scenario with a dropped CDC row is detected",
]

